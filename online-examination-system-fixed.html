<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Online Examination System</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#17316b;--blue:#2d5be3;--bg:#eef3ff;--card:#fff;--tx:#14213d;--mut:#64708a;--bd:#d9e1f2;--ok:#16a34a;--bad:#dc2626;--warn:#f59e0b;--sel:#e3ecff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1630;--card:#16213f;--tx:#e8edf9;--mut:#98a5c4;--bd:#2a3760;--sel:#1f2f5c}}
:root[data-theme="dark"]{--bg:#0e1630;--card:#16213f;--tx:#e8edf9;--mut:#98a5c4;--bd:#2a3760;--sel:#1f2f5c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;font:14px/1.5 Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh}
button{font:inherit;cursor:pointer}a{color:var(--blue);cursor:pointer;text-decoration:none}
.top{background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:12px 24px;gap:12px}
.logo{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px}
.top nav{display:flex;gap:22px;font-size:13px}.top nav a{color:#dbe5ff}
.chip{display:flex;align-items:center;gap:8px;font-size:13px}.av{width:30px;height:30px;border-radius:50%;background:#fff;color:var(--navy);display:grid;place-items:center;font-weight:700}
.btn{background:var(--blue);color:#fff;border:0;border-radius:6px;padding:10px 20px;font-weight:600}.btn:hover{filter:brightness(1.1)}
.btn.o{background:transparent;color:var(--blue);border:1.5px solid var(--blue)}.btn.g{background:var(--ok)}.btn.p{background:#7c3aed}.btn.gr{background:#cfd6e6;color:#26324f}.btn.s{padding:6px 14px;font-size:13px}.btn.r{background:var(--bad)}
.btn.w{width:100%}:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:center;padding:56px 7%;background:linear-gradient(135deg,#eef3ff,#dfe8ff)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .hero{background:linear-gradient(135deg,#13204a,#0e1630)}}
.hero h1{font-size:44px;line-height:1.1;margin:0 0 14px;color:var(--navy)}@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .hero h1{color:#fff}}
.hero p{color:var(--mut);font-size:16px;margin:0 0 24px;max-width:380px}.hero .btn{margin-right:10px}
.feat{display:flex;justify-content:space-around;flex-wrap:wrap;gap:20px;background:var(--card);padding:26px 7%}
.feat div{display:flex;gap:12px;align-items:center}.feat i{width:40px;height:40px;border-radius:8px;background:var(--sel);display:grid;place-items:center;font-style:normal;color:var(--blue);font-size:18px}.feat b{display:block}.feat small{color:var(--mut)}
.center{display:flex;flex-direction:column;align-items:center;padding:24px 16px 48px}.back{align-self:flex-start;margin:0 0 14px max(0px,calc(50% - 280px));font-size:12px}
.box{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:30px;width:100%;max-width:420px;box-shadow:0 6px 24px rgba(30,60,140,.08)}
.box h2{margin:0;text-align:center;font-size:20px}.box .sub{text-align:center;color:var(--mut);margin:4px 0 20px;font-size:13px}
.in{display:flex;align-items:center;gap:8px;border:1px solid var(--bd);border-radius:6px;padding:0 12px;margin-bottom:12px;background:var(--card)}.in span{color:var(--mut)}
.in input{border:0;outline:0;background:transparent;color:var(--tx);padding:11px 0;width:100%;font:inherit}
.row{display:flex;justify-content:space-between;align-items:center;font-size:12px;margin:0 0 14px}.row label{display:flex;gap:6px;align-items:center}
.foot{text-align:center;font-size:12px;margin-top:14px;color:var(--mut)}.err{color:var(--bad);font-size:12px;text-align:center;min-height:16px;margin:-4px 0 8px}
.app{display:grid;grid-template-columns:200px 1fr;min-height:calc(100vh - 54px)}
.side{background:var(--navy);padding:16px 10px}.side a{display:flex;gap:10px;color:#dbe5ff;padding:10px 12px;border-radius:6px;font-size:13px;margin-bottom:4px}.side a.on{background:var(--blue);color:#fff}
.main{padding:24px 28px;min-width:0}.main h2{margin:0 0 16px;font-size:20px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:18px;margin-bottom:18px}.card h3{margin:0 0 12px;font-size:15px}
.welcome{display:flex;justify-content:space-between;align-items:center;gap:10px}.welcome h3{font-size:18px}.welcome p{color:var(--mut);margin:0;max-width:340px}
.ex{display:flex;align-items:center;gap:14px;border:1px solid var(--bd);border-radius:8px;padding:14px;margin-bottom:10px;flex-wrap:wrap}.ex .ic{width:40px;height:40px;border-radius:8px;background:var(--sel);display:grid;place-items:center;color:var(--blue)}.ex .gr1{flex:1;min-width:160px}.ex small{color:var(--mut)}
.tag{font-size:11px;padding:2px 8px;border-radius:4px;font-weight:600}.t-w{background:#fef3c7;color:#92400e}.t-ok{background:#dcfce7;color:#166534}.t-bad{background:#fee2e2;color:#991b1b}
.ql{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.ql div{border:1px solid var(--bd);border-radius:8px;padding:14px;cursor:pointer}.ql small{color:var(--mut);display:block}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:18px}.stats .card{margin:0;display:flex;justify-content:space-between;align-items:center}.stats small{color:var(--mut)}.stats b{font-size:26px;display:block}
.stats i{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-style:normal;background:var(--sel);color:var(--blue)}
.two{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}.act{display:flex;gap:12px;align-items:center;margin-bottom:14px}.act small{color:var(--mut);display:block}
.qa{display:flex;flex-direction:column;gap:10px}
.exam{max-width:760px;margin:24px auto;padding:0 16px}.exam .card{padding:26px}.hd{display:flex;justify-content:space-between;color:var(--mut);margin-bottom:14px}.hd b{color:var(--tx)}
.opt{display:flex;gap:12px;align-items:center;border-radius:6px;padding:12px 14px;margin-bottom:8px;cursor:pointer;border:1px solid transparent}.opt:hover{background:var(--sel)}.opt.on{background:var(--sel);border-color:var(--blue)}
.opt i{width:16px;height:16px;border:2px solid var(--mut);border-radius:50%;flex:none}.opt.on i{border-color:var(--blue);background:radial-gradient(var(--blue) 45%,transparent 50%)}
.nv{display:flex;justify-content:space-between;margin-top:22px}.timer{background:var(--card);color:var(--navy);padding:2px 10px;border-radius:6px;text-align:center;line-height:1.2}.timer small{display:block;font-size:10px;color:var(--mut)}.timer b{font-size:16px}.timer.low b{color:var(--bad)}
.res{max-width:520px;margin:30px auto;text-align:center}.tick{width:56px;height:56px;border-radius:50%;background:var(--ok);color:#fff;font-size:30px;display:grid;place-items:center;margin:0 auto 10px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--bd)}th{background:var(--sel)}.tw{overflow-x:auto}
.res table{text-align:left;margin:16px 0}.res .bt{display:flex;gap:12px}.res .bt .btn{flex:1}
select,textarea{width:100%;border:1px solid var(--bd);border-radius:6px;padding:10px;background:var(--card);color:var(--tx);font:inherit;margin-bottom:12px}textarea{min-height:80px;resize:vertical}
.lab{font-size:12px;color:var(--mut);margin-bottom:4px;display:block}.opr{display:flex;gap:8px;align-items:center}.opr b{width:18px}.opr input{flex:1;border:1px solid var(--bd);border-radius:6px;padding:9px;background:var(--card);color:var(--tx);font:inherit;margin-bottom:8px}
.bye{text-align:center;padding:50px 16px}.bye h2{margin:16px 0 4px}.bye p{color:var(--mut)}
.cor{color:var(--ok);font-weight:600}.wr{color:var(--bad)}
.cam{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));width:140px;background:#000;border-radius:8px;border:2px solid var(--blue);z-index:5;overflow:hidden}.cam video{width:100%;display:block}.cam small{display:block;color:#fff;background:var(--navy);text-align:center;font-size:11px;padding:2px}
.warn{background:#fee2e2;color:#991b1b;padding:8px 12px;border-radius:6px;margin-bottom:12px;font-size:13px}.snaps{display:flex;flex-wrap:wrap;gap:6px}.snaps img{width:96px;border-radius:4px}
.fslock{position:fixed;inset:0;background:var(--bg);z-index:20;display:grid;place-items:center;padding:16px}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:8px;display:none;z-index:30}
@media(max-width:760px){.hero,.two{grid-template-columns:1fr}.hero h1{font-size:34px}.app{grid-template-columns:1fr}.side{display:flex;overflow-x:auto;padding:8px}.side a{white-space:nowrap;margin:0 4px 0 0}.stats,.ql{grid-template-columns:1fr}.top nav{gap:12px}.main{padding:16px}.welcome svg{display:none}}
</style></head><body>
<div id="app"></div><div id="camw" class="cam" style="display:none"><video id="cv" autoplay muted playsinline></video><small>● Monitoring on</small></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),E=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cap='<svg width="26" height="26" viewBox="0 0 24 24" fill="#fff"><path d="M12 3 1 9l11 6 9-4.9V17h2V9L12 3zM5 13.2v3.6c0 1.7 3.1 3.2 7 3.2s7-1.5 7-3.2v-3.6l-7 3.8-7-3.8z"/></svg>';
const Q=[[1,'Which of the following is a high-level programming language?','HTML','Python','CSS','MySQL',1],[1,'What does CPU stand for?','Central Processing Unit','Computer Personal Unit','Central Program Utility','Core Processing Utility',0],[1,'Which device is an input device?','Monitor','Printer','Keyboard','Speaker',2],[1,'Which of these is an operating system?','Linux','Chrome','Oracle','Excel',0],[1,'1 byte equals how many bits?','4','8','16','32',1],[1,'RAM is a type of ___ memory.','Permanent','Volatile','Optical','Read-only',1],[1,'Which is a web browser?','Firefox','Windows','Photoshop','Java',0],[1,'Binary number system has base:','2','8','10','16',0],[1,'Which is an output device?','Mouse','Scanner','Projector','Webcam',2],[1,'Full form of URL is:','Uniform Resource Locator','Universal Reference Link','Unified Resource Loader','Uniform Router Link',0],
[2,'HTML stands for:','Hyper Text Markup Language','High Text Machine Language','Hyperlink Tool Markup Level','Home Tool Markup Language',0],[2,'Which language styles web pages?','Python','CSS','SQL','C',1],[2,'Which tag creates a hyperlink?','&lt;img&gt;','&lt;p&gt;','&lt;a&gt;','&lt;div&gt;',2],[2,'JavaScript runs mainly in the:','Browser','Printer','BIOS','Router',0],[2,'Which is a database?','MySQL','Bootstrap','React','Sass',0],[2,'Which symbol selects an ID in CSS?','.','#','*','&',1],[2,'HTTP status 404 means:','Server error','Not found','Success','Forbidden',1],[2,'Which tag is the largest heading?','&lt;h6&gt;','&lt;h3&gt;','&lt;head&gt;','&lt;h1&gt;',3],[2,'Which is a JS framework?','Django','React','Laravel','Flask',1],[2,'Which method sends data in the URL?','GET','POST','PUT','DELETE',0]];
const seed=()=>({users:[{id:1,name:'Gauri Fukat',email:'gauri@gmail.com',pw:'gauri123'}],exams:[{id:1,title:'Computer Fundamentals',mins:20},{id:2,title:'Web Development Basics',mins:15}],qs:Q.map((q,i)=>({id:i+1,e:q[0],q:q[1],o:q.slice(2,6),a:q[6]})),res:[]});
let DB;try{DB=JSON.parse(localStorage.getItem('oes'))}catch(e){}DB=DB||seed();
const save=()=>{try{localStorage.setItem('oes',JSON.stringify(DB))}catch(e){}};
let S={v:'home',u:null,admin:false,ex:null,ans:[],i:0,left:0,t:null,last:null,sheet:false,sel:1};
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2200)};
const go=v=>{S.v=v;window.scrollTo(0,0);R()};
const logout=()=>{stopProc();S.u=null;S.admin=false;go('bye')};
const qs=e=>DB.qs.filter(q=>q.e==e),ex=id=>DB.exams.find(e=>e.id==id);
const hdr=(r)=>`<div class="top"><div class="logo">${cap}Online Examination System</div>${r||''}</div>`;
const pubnav=`<nav><a onclick="go('home')">Home</a><a onclick="toast('A simple, secure online exam platform')">About</a><a onclick="go('slog')">Login</a><a onclick="go('reg')">Register</a></nav>`;
const chip=(n,r)=>`<div class="chip"><div class="av">${E(n[0])}</div><div>${E(n)}<br><small style="opacity:.7">${r}</small></div></div>`;
const inp=(id,ic,ph,t)=>`<div class="in"><span>${ic}</span><input id="${id}" type="${t||'text'}" placeholder="${ph}"></div>`;
const NAV={s:[['sdash','▦','Dashboard'],['sexams','▤','Available Exams'],['sres','✔','My Results'],['sprof','☺','Profile'],['out','⇥','Logout']],a:[['adash','▦','Dashboard'],['aq','？','Manage Questions'],['aex','▤','Manage Exams'],['ares','✔','View Results'],['astu','☺','Students'],['out','⇥','Logout']]};
const lay=(r,body)=>hdr(r=='s'?chip(S.u.name,'Student'):chip('Admin','Administrator'))+`<div class="app"><div class="side">${NAV[r].map(n=>`<a class="${S.v==n[0]?'on':''}" onclick="${n[0]=='out'?'logout()':`go('${n[0]}')`}"><span>${n[1]}</span>${n[2]}</a>`).join('')}</div><div class="main">${body}</div></div>`;
const done=(eid)=>DB.res.find(r=>r.uid==S.u.id&&r.eid==eid);
const exRow=e=>{const d=done(e.id);return `<div class="ex"><div class="ic">▤</div><div class="gr1"><b>${E(e.title)}</b><br><small>Total Questions: ${qs(e.id).length} &nbsp;|&nbsp; Time: ${e.mins} Minutes</small></div>${d?`<span class="tag t-ok">Completed ${d.score}/${d.total}</span>`:'<span class="tag t-w">Not Started</span>'}<button class="btn s" onclick="start(${e.id})">${d?'Retake Exam':'Start Exam'}</button></div>`};
function start(id){if(!qs(id).length)return toast('This exam has no questions yet');S.ex=ex(id);S.stream=null;go('pre')}
function begin(){S.ans=qs(S.ex.id).map(()=>-1);S.i=0;S.left=S.ex.mins*60;clearInterval(S.t);S.t=setInterval(()=>{S.left--;const t=$('#tm');if(t){t.textContent=fmt(S.left);t.parentNode.classList.toggle('low',S.left<60)}if(S.left<=0)finish()},1000);startProc();go('exam')}
async function camOn(){const m=$('#cm');try{S.stream=await navigator.mediaDevices.getUserMedia({video:{width:320,height:240},audio:false});$('#pv').srcObject=S.stream;m.textContent='Camera ready. You can start the exam.';m.className='cor';$('#sb').disabled=false}catch(e){m.textContent='Camera error ('+e.name+'). The camera is blocked or not found. Allow camera access for this page in your browser, then try again. If it stays blocked, open the exam link in its own browser tab.';m.className='wr'}}
function startProc(){S.log=[];S.snaps=[];S.viol=0;S.warn='';S.fm=0;S.needFs=false;$('#cv').srcObject=S.stream;setTimeout(snap,1500);S.si=setInterval(snap,20000);if('FaceDetector' in window){try{S.fd=new FaceDetector({fastMode:true});S.fi=setInterval(chk,4000)}catch(e){}}try{document.documentElement.requestFullscreen().catch(()=>{})}catch(e){}}
function stopProc(){clearInterval(S.t);clearInterval(S.si);clearInterval(S.fi);if(S.stream){S.stream.getTracks().forEach(t=>t.stop());S.stream=null}const v=$('#cv');if(v)v.srcObject=null;try{if(document.fullscreenElement)document.exitFullscreen()}catch(e){}S.warn='';S.needFs=false}
function snap(){const v=$('#cv');if(S.v!='exam'||!v||!v.videoWidth)return;const c=document.createElement('canvas');c.width=160;c.height=120;c.getContext('2d').drawImage(v,0,0,160,120);S.snaps.push(c.toDataURL('image/jpeg',.5));if(S.snaps.length>12)S.snaps.splice(1,1)}
async function chk(){if(S.v!='exam')return;try{const n=(await S.fd.detect($('#cv'))).length;if(n==1)S.fm=0;else if(++S.fm>=2){S.fm=0;flag(n?'Multiple faces detected':'No face detected')}}catch(e){}}
function flag(m){if(S.v!='exam')return;const n=Date.now();if(S.lf&&n-S.lf<1500)return;S.lf=n;S.viol++;S.log.push({t:new Date().toLocaleTimeString(),m});S.warn='Warning '+S.viol+' of 3: '+m+'. After 3 warnings the exam is submitted.';if(S.viol>=3){toast('Too many violations. Exam submitted.');finish();return}R()}
document.addEventListener('visibilitychange',()=>{if(document.hidden)flag('You left the exam tab')});
window.addEventListener('blur',()=>flag('The exam window lost focus'));
document.addEventListener('fullscreenchange',()=>{if(S.v!='exam')return;if(document.fullscreenElement){S.needFs=false;R();return}S.needFs=true;S.lf=0;flag('You exited full screen');if(S.v=='exam')R()});
function reFs(){const d=document.documentElement;(d.requestFullscreen?d.requestFullscreen():Promise.reject()).then(()=>{S.needFs=false;R()}).catch(()=>toast('Could not enter full screen. Press F11 or allow full screen.'))}
['copy','paste','cut','contextmenu'].forEach(ev=>document.addEventListener(ev,e=>{if(S.v=='exam')e.preventDefault()}));
const fmt=s=>String(Math.floor(Math.max(s,0)/60)).padStart(2,'0')+':'+String(Math.max(s,0)%60).padStart(2,'0');
function finish(){stopProc();const L=qs(S.ex.id);const sc=L.filter((q,i)=>S.ans[i]==q.a).length;S.last={uid:S.u.id,eid:S.ex.id,score:sc,total:L.length,ans:[...S.ans],date:new Date().toLocaleDateString(),log:S.log,snaps:S.snaps,viol:S.viol};DB.res.push(S.last);save();S.sheet=false;go('result')}
function login(){const u=DB.users.find(u=>u.email==$('#em').value.trim().toLowerCase()&&u.pw==$('#pw').value);if(!u)return $('#er').textContent='Invalid email or password.';S.u=u;go('sdash')}
function reg(){const n=$('#nm').value.trim(),m=$('#em').value.trim().toLowerCase(),p=$('#pw').value,c=$('#cp').value,er=x=>$('#er').textContent=x;
if(!n||!m||!p)return er('Fill in all fields.');if(!/^\S+@\S+\.\S+$/.test(m))return er('Enter a valid email address.');if(p.length<6)return er('Password needs at least 6 characters.');if(p!=c)return er('Passwords do not match.');if(DB.users.some(u=>u.email==m))return er('This email is already registered.');
DB.users.push({id:Date.now(),name:n,email:m,pw:p});save();toast('Registered. You can log in now.');go('slog')}
function alogin(){if($('#ai').value=='admin'&&$('#pw').value=='admin123'){S.admin=true;go('adash')}else $('#er').textContent='Wrong admin ID or password.'}
function addQ(){const q=$('#qt').value.trim(),o=[...'abcd'].map(x=>$('#o'+x).value.trim()),a=$('#ca').value;if(!q||o.some(x=>!x)||a=='')return toast('Fill the question, all options and the answer');
DB.qs.push({id:Date.now(),e:+$('#se').value,q:E(q),o:o.map(E),a:+a});S.sel=+$('#se').value;save();toast('Question saved');R()}
const delQ=id=>{DB.qs=DB.qs.filter(q=>q.id!=id);save();R()};
function addEx(){const t=$('#xt').value.trim(),m=+$('#xm').value;if(!t||!m)return toast('Enter exam name and minutes');DB.exams.push({id:Date.now(),title:t,mins:m});save();toast('Exam created');R()}
const delEx=id=>{DB.exams=DB.exams.filter(e=>e.id!=id);DB.qs=DB.qs.filter(q=>q.e!=id);save();R()};
const sel=(id,v)=>`<select id="${id}" onchange="S.sel=this.value;S.rep=null;R()">${DB.exams.map(e=>`<option value="${e.id}" ${e.id==v?'selected':''}>${E(e.title)}</option>`).join('')}</select>`;
const V={
home:()=>hdr(pubnav)+`<div class="hero"><div><h1>Online<br>Examination System</h1><p>A simple, secure and efficient way to conduct online examinations.</p><button class="btn" onclick="go('slog')">Student Login</button><button class="btn o" onclick="go('reg')">Register</button><p style="margin:18px 0 0;font-size:12px">Administrator? <a onclick="go('alog')">Admin login</a></p></div>
<svg viewBox="0 0 320 240" style="width:100%;max-width:420px;justify-self:center"><circle cx="170" cy="120" r="105" fill="#c9d8ff" opacity=".5"/><rect x="70" y="60" width="180" height="115" rx="8" fill="#243a7a"/><rect x="78" y="68" width="164" height="99" rx="3" fill="#eaf1ff"/><rect x="92" y="84" width="60" height="6" rx="3" fill="#2d5be3"/><rect x="92" y="98" width="110" height="5" rx="2" fill="#b6c6ee"/><rect x="92" y="110" width="90" height="5" rx="2" fill="#b6c6ee"/><circle cx="96" cy="128" r="4" fill="#2d5be3"/><circle cx="96" cy="142" r="4" fill="#b6c6ee"/><path d="M50 178h220l-14 14H64z" fill="#3b4f94"/><path d="M160 8 98 34l62 26 62-26z" fill="#1c2f66"/><path d="M128 46v18c0 8 15 14 32 14s32-6 32-14V46l-32 14z" fill="#2a4189"/><path d="M222 34v26" stroke="#f5b83d" stroke-width="3"/></svg></div>
<div class="feat"><div><i>▤</i><span><b>Easy to Use</b><small>Simple and clean interface</small></span></div><div><i>⛨</i><span><b>Secure</b><small>Your data is safe with us</small></span></div><div><i>✔</i><span><b>Instant Results</b><small>Get results immediately</small></span></div></div>`,
reg:()=>hdr(pubnav)+`<div class="center"><a class="back" onclick="go('home')">← Back to Home</a><div class="box"><h2>Student Registration</h2><p class="sub">Create your account to start the exam</p>${inp('nm','☺','Full Name')}${inp('em','✉','Email Address','email')}${inp('pw','🔒','Password','password')}${inp('cp','🔒','Confirm Password','password')}<div class="err" id="er"></div><button class="btn w" onclick="reg()">Register</button><div class="foot">Already have an account? <a onclick="go('slog')">Login</a></div></div></div>`,
slog:()=>hdr(pubnav)+`<div class="center"><a class="back" onclick="go('home')">← Back to Home</a><div class="box"><h2>Student Login</h2><p class="sub">Login to access your dashboard</p>${inp('em','✉','Email Address','email')}${inp('pw','🔒','Password','password')}<div class="row"><label><input type="checkbox"> Remember Me</label><a onclick="toast('Ask your administrator to reset it')">Forgot Password?</a></div><div class="err" id="er"></div><button class="btn w" onclick="login()">Login</button><div class="foot">Don't have an account? <a onclick="go('reg')">Register</a><br><br>Demo: gauri@gmail.com / gauri123</div></div></div>`,
alog:()=>hdr()+`<div class="center"><a class="back" onclick="go('home')">← Back to Home</a><div class="box"><h2>Admin Login</h2><p class="sub">Login to manage exams and results</p>${inp('ai','☺','Admin ID')}${inp('pw','🔒','Password','password')}<div class="row"><label><input type="checkbox"> Remember Me</label></div><div class="err" id="er"></div><button class="btn w" onclick="alogin()">Login</button><div class="foot">Demo: admin / admin123</div></div></div>`,
sdash:()=>lay('s',`<h2>Student Dashboard</h2><div class="card welcome"><div><h3>Hello, ${E(S.u.name.split(' ')[0])}!</h3><p>Welcome to your exam portal. You can take exams, view your results and track your progress here.</p></div><svg width="90" height="70" viewBox="0 0 90 70"><circle cx="45" cy="28" r="14" fill="#f2c9a0"/><path d="M45 6 22 15l23 9 23-9z" fill="#17316b"/><path d="M15 70c0-18 12-26 30-26s30 8 30 26z" fill="#2d5be3"/></svg></div>
<div class="card"><h3>Available Exams</h3>${DB.exams.map(exRow).join('')||'<small>No exams yet.</small>'}</div>
<h3 style="margin:0 0 10px;font-size:15px">Quick Links</h3><div class="ql"><div onclick="go('sprof')"><b>View Profile</b><small>Manage your details</small></div><div onclick="go('sres')"><b>My Results</b><small>Check your performance</small></div><div onclick="toast('Read each question, pick one option, and submit before time ends')"><b>Instructions</b><small>Read exam guidelines</small></div></div>`),
sexams:()=>lay('s',`<h2>Available Exams</h2><div class="card">${DB.exams.map(exRow).join('')}</div>`),
sres:()=>{const r=DB.res.filter(r=>r.uid==S.u.id);return lay('s',`<h2>My Results</h2><div class="card tw">${r.length?`<table><tr><th>Exam</th><th>Marks</th><th>Percentage</th><th>Date</th><th>Status</th></tr>${r.map(x=>{const p=Math.round(x.score/x.total*100);return `<tr><td>${E(ex(x.eid)?.title||'Deleted exam')}</td><td>${x.score}/${x.total}</td><td>${p}%</td><td>${x.date}</td><td>${tg(p)}</td></tr>`}).join('')}</table>`:'<small>You have not taken any exam yet. Start one from your dashboard.</small>'}</div>`)},
sprof:()=>lay('s',`<h2>Profile</h2><div class="card"><p><b>Name:</b> ${E(S.u.name)}</p><p><b>Email:</b> ${E(S.u.email)}</p><p><b>Exams taken:</b> ${DB.res.filter(r=>r.uid==S.u.id).length}</p></div>`),
pre:()=>hdr(chip(S.u.name,'Student'))+`<div class="center"><div class="box" style="max-width:520px"><h2>${E(S.ex.title)}</h2><p class="sub">This exam is proctored. Please read before you start.</p><video id="pv" autoplay muted playsinline style="width:100%;border-radius:8px;background:#000;aspect-ratio:4/3"></video><p id="cm" style="font-size:13px">Camera is off.</p><ul style="font-size:13px;color:var(--mut);padding-left:18px"><li>Your camera takes a photo every 20 seconds.</li><li>Leaving the tab, exiting full screen, or a missing face is recorded as a violation.</li><li>After 3 violations the exam is submitted automatically.</li><li>Copy, paste and right-click are disabled during the exam.</li></ul><button class="btn o w" style="margin-bottom:10px" onclick="camOn()">Turn on camera</button><button id="sb" class="btn w" disabled onclick="begin()">I agree. Start exam</button><div class="foot"><a onclick="stopProc();go('sdash')">Cancel</a></div></div></div>`,
exam:()=>{const L=qs(S.ex.id),q=L[S.i],last=S.i==L.length-1;return hdr(`<div class="timer"><small>Time Left</small><b id="tm">${fmt(S.left)}</b></div>`)+(S.needFs?`<div class="fslock"><div class="box" style="max-width:420px;text-align:center"><h2>Full screen required</h2><p class="sub">You left full screen. The exam is hidden until you return. The timer is still running.</p><button class="btn w" onclick="reFs()">Return to full screen</button></div></div>`:'')+`<div class="exam"><div class="card">${S.warn?`<div class="warn">${S.warn}</div>`:''}<div class="hd"><b>${E(S.ex.title)}</b><span>Question ${S.i+1} of ${L.length}</span></div><p style="font-weight:600;font-size:15px">Q. ${q.q}</p>${q.o.map((o,i)=>`<div class="opt ${S.ans[S.i]==i?'on':''}" onclick="S.ans[S.i]=${i};R()"><i></i><span>${'ABCD'[i]}. ${o}</span></div>`).join('')}<div class="nv"><button class="btn o" ${S.i?'':'disabled style="opacity:.4"'} onclick="S.i--;R()">Previous</button>${last?`<button class="btn g" onclick="if(S.ans.includes(-1)&&!confirm('Some questions are unanswered. Submit anyway?'))return;finish()">Submit Exam</button>`:`<button class="btn" onclick="S.i++;R()">Next</button>`}</div></div></div>`},
result:()=>{const x=S.last,p=Math.round(x.score/x.total*100),L=qs(x.eid);return lay('s',`<div class="res card"><div class="tick">✓</div><h2 style="margin:0">Exam Completed!</h2><small style="color:var(--mut)">Here are your results</small><table><tr><td>Total Questions</td><td>${x.total}</td></tr><tr><td>Correct Answers</td><td>${x.score}</td></tr><tr><td>Wrong Answers</td><td>${x.total-x.score}</td></tr><tr><td>Obtained Marks</td><td>${x.score} / ${x.total} (${p}%) ${tg(p)}</td></tr></table><div class="bt"><button class="btn g" onclick="S.sheet=!S.sheet;R()">${S.sheet?'Hide':'View'} Answer Sheet</button><button class="btn" onclick="go('sdash')">Back to Dashboard</button></div>${S.sheet?`<div style="text-align:left;margin-top:18px">${L.map((q,i)=>`<p><b>${i+1}. ${q.q}</b><br>Your answer: <span class="${x.ans[i]==q.a?'cor':'wr'}">${x.ans[i]<0?'Not answered':q.o[x.ans[i]]}</span><br>Correct: <span class="cor">${q.o[q.a]}</span></p>`).join('')}</div>`:''}</div>`)},
adash:()=>{const rc=[...DB.res].reverse().slice(0,3);return lay('a',`<h2>Admin Dashboard</h2><div class="stats"><div class="card"><div><small>Total Students</small><b>${DB.users.length}</b></div><i>☺</i></div><div class="card"><div><small>Total Exams</small><b>${DB.exams.length}</b></div><i>▤</i></div><div class="card"><div><small>Total Questions</small><b>${DB.qs.length}</b></div><i>？</i></div></div><div class="two"><div class="card"><h3>Recent Activity</h3>${rc.map(r=>`<div class="act"><i class="av" style="background:var(--sel);color:var(--blue);font-style:normal">✔</i><div>Exam completed<small>${E(DB.users.find(u=>u.id==r.uid)?.name||'Student')} · ${r.date}</small></div></div>`).join('')||'<small>No exams taken yet.</small>'}</div><div class="card"><h3>Quick Actions</h3><div class="qa"><button class="btn" onclick="go('aq')">Add Question</button><button class="btn p" onclick="go('aex')">Create Exam</button><button class="btn g" onclick="go('ares')">View Results</button></div></div></div>`)},
aq:()=>{const L=qs(S.sel);return lay('a',`<h2>Add New Question</h2><div class="card"><span class="lab">Select Exam</span>${sel('se',S.sel)}<span class="lab">Question</span><textarea id="qt" placeholder="Enter your question here..."></textarea><span class="lab">Options</span>${[...'abcd'].map((x,i)=>`<div class="opr"><b>${'ABCD'[i]}.</b><input id="o${x}" placeholder="Enter option ${'ABCD'[i]}"></div>`).join('')}<span class="lab">Correct Answer</span><select id="ca"><option value="">Select correct answer</option>${[...'ABCD'].map((x,i)=>`<option value="${i}">${x}</option>`).join('')}</select><div style="display:flex;gap:10px"><button class="btn" style="flex:1" onclick="addQ()">Save Question</button><button class="btn gr" style="flex:1" onclick="R()">Reset</button></div></div><div class="card tw"><h3>Questions in this exam (${L.length})</h3><table>${L.map((q,i)=>`<tr><td>${i+1}</td><td>${q.q}</td><td>Ans: ${'ABCD'[q.a]}</td><td><button class="btn r s" onclick="delQ(${q.id})">Delete</button></td></tr>`).join('')}</table></div>`)},
aex:()=>lay('a',`<h2>Manage Exams</h2><div class="card"><h3>Create Exam</h3><div class="opr"><input id="xt" placeholder="Exam name"><input id="xm" type="number" min="1" placeholder="Minutes" style="max-width:110px"><button class="btn" style="margin-bottom:8px" onclick="addEx()">Create</button></div></div><div class="card tw"><table><tr><th>Exam</th><th>Questions</th><th>Time</th><th></th></tr>${DB.exams.map(e=>`<tr><td>${E(e.title)}</td><td>${qs(e.id).length}</td><td>${e.mins} min</td><td><button class="btn r s" onclick="if(confirm('Delete this exam and its questions?'))delEx(${e.id})">Delete</button></td></tr>`).join('')}</table></div>`),
ares:()=>{const r=DB.res.filter(x=>x.eid==S.sel);return lay('a',`${repo()}<h2>View Student Results</h2><div class="card"><span class="lab">Select Exam</span>${sel('se',S.sel)}<div class="tw"><table><tr><th>Sr. No.</th><th>Student Name</th><th>Email</th><th>Marks</th><th>Percentage</th><th>Status</th><th>Flags</th><th></th></tr>${r.map((x,i)=>{const u=DB.users.find(u=>u.id==x.uid)||{name:'—',email:'—'},p=Math.round(x.score/x.total*100);return `<tr><td>${i+1}</td><td>${E(u.name)}</td><td>${E(u.email)}</td><td>${x.score}/${x.total}</td><td>${p}%</td><td>${tg(p)}</td><td>${x.viol||0}</td><td>${x.log?`<button class="btn s" onclick="S.rep=${DB.res.indexOf(x)};R()">Report</button>`:''}</td></tr>`}).join('')||'<tr><td colspan="8">No results for this exam yet.</td></tr>'}</table></div></div>`)},
astu:()=>lay('a',`<h2>Students</h2><div class="card tw"><table><tr><th>Sr. No.</th><th>Name</th><th>Email</th><th>Exams taken</th></tr>${DB.users.map((u,i)=>`<tr><td>${i+1}</td><td>${E(u.name)}</td><td>${E(u.email)}</td><td>${DB.res.filter(r=>r.uid==u.id).length}</td></tr>`).join('')}</table></div>`),
bye:()=>hdr()+`<div class="bye"><svg width="120" height="110" viewBox="0 0 120 110"><circle cx="60" cy="48" r="22" fill="#f2c9a0"/><path d="M60 8 24 22l36 14 36-14z" fill="#17316b"/><path d="M20 110c0-28 18-38 40-38s40 10 40 38z" fill="#2d5be3"/><circle cx="96" cy="26" r="12" fill="#16a34a"/><path d="m90 26 4 4 8-8" stroke="#fff" stroke-width="3" fill="none"/></svg><h2>You have been logged out!</h2><p>Thank you for using the Online Examination System.</p><button class="btn" onclick="go('slog')">Login Again</button><p><a onclick="go('home')">Back to Home</a></p></div>`};
const repo=()=>{const x=DB.res[S.rep];if(S.rep==null||!x)return '';const u=DB.users.find(u=>u.id==x.uid)||{name:'Student'};return `<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><h3>Proctor report: ${E(u.name)}</h3><button class="btn gr s" onclick="S.rep=null;R()">Close</button></div><p><b>Violations:</b> ${x.viol||0}</p>${(x.log||[]).length?`<table>${x.log.map(l=>`<tr><td>${l.t}</td><td>${l.m}</td></tr>`).join('')}</table>`:'<p class="cor">No violations recorded.</p>'}<h3 style="margin-top:14px">Camera snapshots</h3><div class="snaps">${(x.snaps||[]).map(i=>`<img src="${i}" alt="Camera snapshot">`).join('')||'<small>No snapshots.</small>'}</div></div>`};
const tg=p=>p>=50?'<span class="tag t-ok">Pass</span>':'<span class="tag t-bad">Fail</span>';
function R(){const g=['sdash','sexams','sres','sprof','pre','exam','result'].includes(S.v);if(g&&!S.u)S.v='slog';if(S.v[0]=='a'&&S.v!='alog'&&!S.admin)S.v='alog';if(!DB.exams.some(e=>e.id==S.sel))S.sel=DB.exams[0]?.id;$('#app').innerHTML=V[S.v]();$('#camw').style.display=S.v=='exam'?'block':'none'}
R();
</script></body></html>
